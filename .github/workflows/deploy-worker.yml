name: Deploy Discord OAuth Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_REDIRECT_URI: ${{ secrets.DISCORD_REDIRECT_URI }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        working-directory: server
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_KV_NAMESPACE_ID DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_REDIRECT_URI TOKEN_ENCRYPTION_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing GitHub Actions secret: $key"; exit 1; fi
          done
          [[ "$CLOUDFLARE_KV_NAMESPACE_ID" =~ ^[a-f0-9]{32}$ ]]
          node -e 'const fs=require("node:fs");const p="wrangler.toml";const s=fs.readFileSync(p,"utf8");if(!s.includes("REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"))throw new Error("KV placeholder not found");fs.writeFileSync(p,s.replace("REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID",process.env.CLOUDFLARE_KV_NAMESPACE_ID));'
          node -e 'const fs=require("node:fs");const k=["DISCORD_CLIENT_ID","DISCORD_CLIENT_SECRET","DISCORD_REDIRECT_URI","TOKEN_ENCRYPTION_KEY"];const v=Object.fromEntries(k.map(x=>[x,process.env[x]]));fs.writeFileSync("/tmp/discord-ps4-worker-secrets.json",JSON.stringify(v),{mode:0o600});'
          node --check worker.js
          node --test worker.test.mjs

      - name: Upload Worker secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: secret bulk /tmp/discord-ps4-worker-secrets.json

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
